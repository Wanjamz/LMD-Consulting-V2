
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMD Consulting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#0A1A1A',
              navy: '#06073B',
              teal: '#5EEAD4',
              cyan: '#22D3EE',
              lavender: '#A19BF4',
            },
            surface: {
              light: '#F8FAFC',
              muted: '#F1F5F9',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          borderRadius: {
            'card': '32px',
            'pill': '9999px',
          },
          spacing: {
            '18': '72px',
            '24': '96px',
            '30': '120px',
          },
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
      background-color: #F8FAFC;
    }

    /* Grainy Noise Overlay */
    .grain {
      position: relative;
    }
    .grain::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.04;
      pointer-events: none;
      z-index: 10;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Artaka Style Hero Gradient */
    .artaka-hero {
      background: radial-gradient(circle at 70% 20%, #22D3EE 0%, transparent 60%),
                  radial-gradient(circle at 10% 80%, #A19BF4 0%, transparent 50%),
                  #F8FAFC;
    }

    .sharya-section {
       background: radial-gradient(circle at 90% 90%, #5EEAD4 0%, transparent 40%),
                   radial-gradient(circle at 10% 10%, #F1F5F9 0%, #FFFFFF 100%);
    }

    h1, h2, h3 {
      letter-spacing: -0.02em;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="grain">
  <div id="root"></div>
</body>
</html>
